<!doctype html><html><body style="margin:0;background:#111"><canvas id="c" width="640" height="400"></canvas>
<script type="module">
import * as THREE from "../shared/vendor/three.module.min.js";
const r = new THREE.WebGLRenderer({ canvas: document.getElementById("c"), antialias: true });
const s = new THREE.Scene(); s.background = new THREE.Color(0x202838);
const cam = new THREE.PerspectiveCamera(45, 640/400, .1, 100); cam.position.set(3,3,5); cam.lookAt(0,0,0);

r.render(s, cam);

window.__info = { rev: THREE.REVISION, webgl2: r.capabilities.isWebGL2, renderer: dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : "n/a", maxTex: gl.getParameter(gl.MAX_TEXTURE_SIZE), floatTex: !!gl.getExtension("EXT_color_buffer_float") };
</script></body></html>
