<style>
:root{
  --bg:#09090d;--win:rgba(19,19,25,.74);--ink:#f3f3f6;--mut:#a7a7b2;--dim:#72727e;
  --line:rgba(255,255,255,.085);--line2:rgba(255,255,255,.15);--sel:rgba(255,255,255,.085);--tile:rgba(255,255,255,.07);--kbd:rgba(255,255,255,.09);
  --acc:#a093ff;--on-acc:#0e0b22;--glow:.5;--shadow:0 50px 130px -40px rgba(0,0,0,.9);--hi:rgba(255,255,255,.07);--foot:rgba(0,0,0,.16);
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;color-scheme:dark
}
:root[data-theme="light"]{
  --bg:#f0eff6;--win:rgba(255,255,255,.8);--ink:#15151c;--mut:#54545f;--dim:#82828e;
  --line:rgba(16,16,28,.09);--line2:rgba(16,16,28,.16);--sel:rgba(16,16,28,.065);--tile:rgba(16,16,28,.055);--kbd:rgba(16,16,28,.065);
  --acc:#5a48f2;--on-acc:#fff;--glow:.4;--shadow:0 50px 110px -50px rgba(50,40,110,.55);--hi:rgba(255,255,255,.8);--foot:rgba(16,16,28,.03);color-scheme:light
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14.5px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:100dvh;transition:background .4s,color .4s}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,p,dl,dd,ol,ul{margin:0;padding:0}
ol,ul{list-style:none}
img{display:block;max-width:100%}
svg{width:1em;height:1em;flex:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
kbd{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;font:500 11px/1 var(--mono);border-radius:6px;background:var(--kbd);color:var(--mut);border:1px solid var(--line)}

/* the glow behind the window takes its colours from what is selected */
.amb{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.amb i{position:absolute;width:56vmax;height:56vmax;border-radius:50%;filter:blur(120px);opacity:var(--glow);transition:background-color .8s}
#g1{left:-6%;top:-30%;background:#6a5cff}
#g2{right:-10%;bottom:-38%;background:#ff5c9a}
.amb b{position:absolute;inset:0;background-image:radial-gradient(var(--line2) 1px,transparent 1.4px);background-size:26px 26px;-webkit-mask-image:radial-gradient(75% 65% at 50% 46%,#000 25%,transparent 78%);mask-image:radial-gradient(75% 65% at 50% 46%,#000 25%,transparent 78%)}

.top{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:calc(16px + env(safe-area-inset-top,0px)) max(22px,env(safe-area-inset-right,0px)) 0 max(22px,env(safe-area-inset-left,0px))}
.top h1{display:flex;align-items:center;gap:11px;font-size:14.5px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
.top h1 img{width:36px;height:36px;border-radius:50%;object-fit:cover}
.top h1 small{display:block;font-weight:400;font-size:12.5px;color:var(--dim);letter-spacing:0}
.top nav{display:flex;gap:6px}
.top nav a,.top nav button{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:var(--tile);color:var(--mut);font-size:16px;transition:color .2s,border-color .2s}
.top nav a:hover,.top nav button:hover{color:var(--ink);border-color:var(--line2)}

.stage{display:grid;place-items:center;min-height:0;padding:16px max(18px,env(safe-area-inset-right,0px)) 8px max(18px,env(safe-area-inset-left,0px))}
.win{width:min(1010px,100%);height:min(650px,100%);display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;background:var(--win);border:1px solid var(--line2);border-radius:18px;box-shadow:var(--shadow),inset 0 1px 0 var(--hi);-webkit-backdrop-filter:blur(40px) saturate(170%);backdrop-filter:blur(40px) saturate(170%);overflow:hidden;animation:pop .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.975)}}
.q{display:flex;align-items:center;gap:12px;height:62px;padding:0 16px 0 20px;border-bottom:1px solid var(--line)}
.q>svg{font-size:19px;color:var(--dim)}
.q input{flex:1;min-width:0;height:100%;border:0;background:none;outline:0;color:var(--ink);font:400 18px var(--sans);letter-spacing:-.012em;caret-color:var(--acc)}
.q input::placeholder{color:var(--dim)}
.q button{border:0;background:none;padding:0}
.chips{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;display:inline-flex;gap:7px;align-items:center;height:28px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--mut);font-size:12.5px;font-weight:500;transition:color .15s,border-color .15s}
.chips button:hover{color:var(--ink);border-color:var(--line2)}
.chips button i{font:500 11px/1 var(--mono);font-style:normal;color:var(--dim)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:transparent}
.chips button[aria-pressed="true"] i{color:inherit;opacity:.6}

.body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.06fr);min-height:0}
.list{overflow-y:auto;padding:4px 8px 10px;scrollbar-width:thin;scrollbar-color:var(--line2) transparent;overscroll-behavior:contain;outline:0}
.gh{padding:13px 10px 6px;font-size:11.5px;font-weight:600;color:var(--dim);letter-spacing:.02em}
.it{position:relative;display:grid;grid-template-columns:28px minmax(0,max-content) minmax(0,1fr) auto;align-items:center;gap:11px;width:100%;height:42px;padding:0 10px;border:0;border-radius:9px;background:none;text-align:left;cursor:pointer;scroll-margin:40px 0 10px}
.it[aria-selected="true"]{background:var(--sel)}
.it[aria-selected="true"]::before{content:"";position:absolute;left:-8px;top:11px;bottom:11px;width:3px;border-radius:0 3px 3px 0;background:var(--acc)}
.it .ic{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;background:var(--tile);overflow:hidden;color:var(--mut);font-size:15px}
.it .ic img{width:100%;height:100%;object-fit:cover}
.it .tt{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .tt mark{background:none;color:var(--acc);font-weight:700}
.it .sb{color:var(--dim);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .kd{color:var(--dim);font-size:12.5px}
.none{padding:46px 20px;text-align:center;color:var(--mut)}
.none b{display:block;color:var(--ink);font-size:16px;font-weight:600;margin-bottom:6px}
.none button{margin:14px 3px 0;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);background:none;font-size:13px}

.pane{border-left:1px solid var(--line);overflow-y:auto;padding:18px 18px 20px;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.pv{display:grid;gap:14px;animation:in .28s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.pv h2{font-size:21px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.pv-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pv-p{color:var(--mut);font-size:15px;line-height:1.5}
.chip{flex:none;font:500 11px/1 var(--mono);padding:6px 8px;border-radius:6px;background:var(--tile);border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.cover{position:relative;aspect-ratio:16/7.2;border-radius:12px;overflow:hidden;background:var(--tile);display:grid;place-items:center;border:1px solid var(--line)}
.cover::before{content:"";position:absolute;inset:-30px;background:var(--src) center/cover;filter:blur(26px) saturate(1.3);opacity:.85}
.cover img{position:absolute;top:8%;left:50%;height:84%;width:auto;max-width:none;aspect-ratio:1;transform:translateX(-50%);border-radius:14px;object-fit:cover;box-shadow:0 18px 40px -14px rgba(0,0,0,.6)}
.meta{display:grid;border-top:1px solid var(--line)}
.meta div{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.meta dt{color:var(--dim);white-space:nowrap}
.meta dd{text-align:right;min-width:0;overflow-wrap:anywhere}
.meta .m{font:400 12.5px/1.6 var(--mono)}
.pv-b{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.pri,.alt{display:inline-flex;align-items:center;gap:9px;height:36px;padding:0 8px 0 14px;border-radius:9px;font-weight:600;font-size:13.5px;border:1px solid var(--line2);background:var(--tile)}
.pri{background:var(--acc);color:var(--on-acc);border-color:transparent}
.pri kbd{background:rgba(0,0,0,.16);border-color:transparent;color:inherit}
.alt:hover{border-color:var(--mut)}
.big-ic{width:56px;height:56px;border-radius:15px;display:grid;place-items:center;background:var(--tile);border:1px solid var(--line);font-size:26px;overflow:hidden}
.big-ic img{width:100%;height:100%;object-fit:cover}
.id{display:flex;align-items:center;gap:14px}
.id p{color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stats div{padding:11px 12px;border-radius:11px;background:var(--tile);border:1px solid var(--line)}
.stats b{display:block;font-size:22px;font-weight:600;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.stats span{display:block;margin-top:3px;color:var(--dim);font-size:12px}
.mini{padding:12px 12px 10px;border-radius:11px;background:var(--tile);border:1px solid var(--line)}
.mini-h{display:flex;justify-content:space-between;color:var(--dim);font-size:12px}
.cols{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:7px;margin-top:8px}
.cols li{position:relative;text-align:center;outline-offset:3px;border-radius:4px}
.cols .pl{height:86px;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch}
.cols b{font:500 11px/1 var(--mono);margin-bottom:4px;color:var(--mut)}
.cols i{display:block;flex:0 0 calc((100% - 16px) * var(--v));border-radius:4px 4px 1px 1px;background:var(--acc);min-height:3px}
.cols li.now i{background:repeating-linear-gradient(-45deg,var(--acc) 0 2px,transparent 2px 5px);box-shadow:inset 0 0 0 1px var(--acc)}
.cols span{display:block;margin-top:5px;font:400 10px/1 var(--mono);color:var(--dim)}
.cols li::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 2px);transform:translateX(-50%);padding:6px 8px;border-radius:6px;background:var(--ink);color:var(--bg);font:500 11px/1 var(--mono);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s;z-index:2}
.cols li:hover::after,.cols li:focus-visible::after{opacity:1}
.cols li:first-child::after{left:0;transform:none}.cols li:last-child::after{left:auto;right:0;transform:none}
.me{display:flex;align-items:center;gap:14px}
.me img{width:72px;height:72px;border-radius:18px;object-fit:cover}
.me p{color:var(--mut)}
.keys{display:grid;border-top:1px solid var(--line)}
.keys div{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--mut)}
.keys span{display:inline-flex;gap:4px}

.foot{display:flex;align-items:center;justify-content:space-between;gap:12px;height:44px;padding:0 12px 0 14px;border-top:1px solid var(--line);background:var(--foot);font-size:12.5px;color:var(--mut)}
.foot .st{display:flex;align-items:center;gap:9px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot .st img{width:18px;height:18px;border-radius:5px}
.foot .acts{display:flex;align-items:center;gap:6px;flex:none}
.foot .acts span{display:inline-flex;align-items:center;gap:6px;padding:0 4px}
.foot .acts hr{width:1px;height:16px;border:0;background:var(--line2);margin:0 4px}
.foot .acts b{color:var(--ink);font-weight:600}

.under{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:6px max(22px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(22px,env(safe-area-inset-left,0px));color:var(--dim);font-size:12.5px}
.under span{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}

/* phones: the list is the page and details open in a sheet */
.sheet{position:fixed;inset:0;z-index:40;display:grid;align-items:end;background:rgba(0,0,0,0);transition:background .3s}
.sheet.on{background:rgba(0,0,0,.55)}
.sheet-c{position:relative;max-height:86dvh;overflow-y:auto;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));background:var(--bg);border:1px solid var(--line2);border-bottom:0;border-radius:22px 22px 0 0;transform:translateY(102%);transition:transform .38s cubic-bezier(.2,.8,.2,1)}
.sheet.on .sheet-c{transform:none}
.sheet-x{display:block;width:100%;height:26px;border:0;background:none;position:relative}
.sheet-x::before{content:"";position:absolute;left:50%;top:6px;width:40px;height:4px;margin-left:-20px;border-radius:4px;background:var(--line2)}
.sheet-x:focus-visible{outline:0}.sheet-x:focus-visible::before{background:var(--acc)}
.sheet .pri,.sheet .alt{height:46px;flex:1;justify-content:center;font-size:15px;padding:0 14px}
.sheet kbd{display:none}

@media (max-width:820px){
  .stage{padding:12px 0 0;place-items:stretch}
  .win{width:100%;height:100%;border-radius:20px 20px 0 0;border-left:0;border-right:0;border-bottom:0}
  .body{grid-template-columns:minmax(0,1fr)}
  .pane{display:none}
  .it{height:54px;grid-template-columns:36px minmax(0,max-content) minmax(0,1fr) auto}
  .it .ic{width:36px;height:36px;border-radius:9px}
  .it .tt{font-size:15.5px}
  .foot{height:calc(60px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
  .foot .acts,.under,.q kbd{display:none}
  .q input{font-size:17px}
  .top h1 small{display:none}
}
@media (max-width:420px){.it .sb{display:none}.it{grid-template-columns:36px minmax(0,1fr) auto}}
@media (max-height:620px) and (min-width:821px){.under{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
