<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Iman Khoshabi · imaN Neo</title>
<meta name="description" content="Iman Khoshabi (imaN Neo): senior mobile engineer in Amsterdam, maker of fl_chart and a pile of small games.">
<meta name="theme-color" content="#0c0e12">
<link rel="icon" href="../shared/img/n.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#0c0e12;--dot:rgba(255,255,255,.085);--node:#161a21;--node2:#1c212a;--line:#2a303b;--line2:#434c5c;--ink:#eef0f4;--mut:#a9b0bc;--dim:#737b89;--field:#0f1217;
  --t-me:#e8ebf0;--t-package:#6aa8ff;--t-number:#5fd39a;--t-series:#b58cff;--t-game:#ffb14a;--t-link:#ff7eb6;--t-note:#737b89;
  --sans:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:"Fira Code",ui-monospace,Menlo,Consolas,monospace;color-scheme:dark
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 13.5px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,p,ul,ol,dl,dd,figure{margin:0;padding:0}
ul,ol{list-style:none}
img{display:block;max-width:100%;-webkit-user-drag:none}
svg{width:1em;height:1em;flex:none}
:focus-visible{outline:2px solid var(--t-package);outline-offset:2px;border-radius:6px}

/* ---------- the canvas ---------- */
body[data-view="graph"]{overflow:hidden;height:100dvh}
.canvas{background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.5px);background-size:24px 24px}
body[data-view="graph"] .canvas{position:fixed;inset:0;overflow:hidden;overflow:clip;touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
body[data-view="graph"] .canvas.panning{cursor:grabbing}
body[data-view="graph"] .world{position:absolute;left:0;top:0;transform-origin:0 0}
body[data-view="stack"] .canvas{min-height:100dvh;padding:calc(76px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(80px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
body[data-view="stack"] .world{position:relative;width:min(560px,100%);margin:0 auto;padding-right:34px;display:grid;gap:18px;transform:none!important}

.wires{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.wires path{fill:none;stroke:var(--c);stroke-linecap:round;transition:opacity .2s}
.wires .w{stroke-width:2;opacity:.42}
.wires .f{stroke-width:2.8;stroke-dasharray:.1 14;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-14.1}}
.wires.focus .w:not(.on){opacity:.1}.wires.focus .f:not(.on){opacity:.15}
.wires .w.on{opacity:.9}

/* ---------- nodes ---------- */
.node{position:absolute;left:0;top:0;width:var(--w,280px);background:var(--node);border:1px solid var(--line);border-radius:12px;box-shadow:0 20px 44px -24px rgba(0,0,0,.9);transition:border-color .2s,box-shadow .2s;animation:nin .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--o,0) * 70ms)}
@keyframes nin{from{opacity:0;scale:.94}}
body[data-view="stack"] .node{position:relative;width:auto}
.node:hover,.node:focus-within{border-color:var(--line2)}
.node.drag{border-color:var(--c);box-shadow:0 34px 70px -24px #000;z-index:5}
.nh{position:relative;display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--node2);border-radius:11px 11px 0 0;-webkit-user-select:none;user-select:none}
body[data-view="graph"] .nh{cursor:grab;touch-action:none}
body[data-view="graph"] .dragging .nh{cursor:grabbing}
.nh .sq{width:9px;height:9px;border-radius:3px;background:var(--c)}
.nh h1,.nh h2{font-size:13.5px;font-weight:700;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nh .ty{margin-left:auto;font:400 11px/1 var(--mono);color:var(--dim)}
.pt{position:absolute;width:11px;height:11px;border-radius:50%;background:var(--node);border:2px solid var(--pc,var(--c))}
.nh>.pt{left:-6px;top:50%;margin-top:-5.5px}
.nh>.pt.top{left:50%;top:-6px;margin:0 0 0 -5.5px}
.ports{display:grid;grid-template-columns:auto 1fr;padding:8px 0 0}
.ports li{position:relative;height:24px;display:flex;align-items:center;padding:0 15px;font:400 11.5px/1 var(--mono);color:var(--mut);white-space:nowrap}
.ports .out li{justify-content:flex-end}
.ports li .pt{top:50%;margin-top:-5.5px}
.ports .in li .pt{left:-6px}.ports .out li .pt{right:-6px}
.downs{position:relative}
.down{position:relative;display:flex;justify-content:center;padding:0 0 12px;font:400 11.5px/1 var(--mono);color:var(--mut);white-space:nowrap}
.down .pt{left:50%;bottom:-6px;margin-left:-5.5px}
#n-games .downs{height:24px}
#n-games .down{position:absolute;top:0;width:160px}
.nb{padding:12px 14px 14px;display:grid;gap:11px}
.nb>*{min-width:0}
.nb p{color:var(--mut)}
/* in the page view every port sits on the right edge, where the wires run */
body[data-view="stack"] .ports{grid-template-columns:1fr}
body[data-view="stack"] .ports li{justify-content:flex-end}
body[data-view="stack"] .ports .in li .pt{left:auto;right:-6px}
body[data-view="stack"] .nh>.pt,body[data-view="stack"] .nh>.pt.top{left:auto;right:-6px;top:50%;margin:-5.5px 0 0}
body[data-view="stack"] .downs{padding-bottom:8px}
body[data-view="stack"] .down,body[data-view="stack"] #n-games .down{position:relative;left:auto!important;width:auto;height:24px;align-items:center;justify-content:flex-end;padding:0 15px}
body[data-view="stack"] .down .pt{left:auto;right:-6px;bottom:auto;top:50%;margin:-5.5px 0 0}
body[data-view="stack"] #n-games .downs{height:auto}

.who{display:flex;align-items:center;gap:12px}
.who img{width:58px;height:58px;border-radius:14px;object-fit:cover}
.who b{display:block;font-size:16px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.who span{color:var(--mut);font-size:12.5px}
.params{display:grid;gap:5px}
.params div{display:grid;grid-template-columns:62px minmax(0,1fr);align-items:center;gap:8px}
.params dt{font:400 11.5px/1 var(--mono);color:var(--dim)}
.params dd{padding:6px 9px;border-radius:7px;background:var(--field);border:1px solid var(--line);font-size:12.5px;line-height:1.35}
.pk{display:flex;align-items:center;gap:11px}
.pk img{width:40px;height:40px;border-radius:10px}
.pk p{font-size:13px;line-height:1.4}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:7px;background:var(--field);border:1px solid var(--line);font-weight:600;font-size:12.5px;transition:border-color .15s,background .15s;white-space:nowrap}
.btn:hover{border-color:var(--c);background:var(--node2)}
.btn svg{font-size:11px;color:var(--mut)}
.btn.go{background:var(--c);border-color:transparent;color:#14161a}
.btn.go svg{color:inherit}
.btns .ver{margin-left:auto;align-self:center;font:400 11px/1 var(--mono);color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chips span{font:400 11px/1 var(--mono);padding:5px 5px;border-radius:6px;background:var(--field);border:1px solid var(--line);color:var(--mut)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.card .nb{gap:8px;padding-top:10px}
.card .cv{width:100%;height:auto;aspect-ratio:16/9.6;object-fit:cover;border-radius:8px}
.card .tg{font:400 11px/1.3 var(--mono);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card p{font-size:12.5px;line-height:1.4}
.card .btn{justify-content:center;margin-top:2px}
.card .nh h2{font-size:13px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.stats div{padding:9px 11px;border-radius:9px;background:var(--field);border:1px solid var(--line)}
.stats b{display:block;font-size:21px;font-weight:800;letter-spacing:-.03em;line-height:1.15;font-variant-numeric:tabular-nums}
.stats span{display:block;color:var(--dim);font-size:11.5px;margin-top:1px}
.cap{display:flex;justify-content:space-between;font:400 11.5px/1 var(--mono);color:var(--dim)}
.cols{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px}
.cols li{position:relative;text-align:center;border-radius:4px}
.cols .pl{height:118px;display:flex;flex-direction:column;justify-content:flex-end}
.cols b{font:500 11.5px/1 var(--mono);margin-bottom:5px}
.cols i{display:block;flex:0 0 calc((100% - 18px) * var(--v));min-height:3px;border-radius:4px 4px 1px 1px;background:var(--c)}
.cols li.now i{background:repeating-linear-gradient(-45deg,var(--c) 0 2px,transparent 2px 5.5px);box-shadow:inset 0 0 0 1px var(--c)}
.cols span{display:block;margin-top:6px;font:400 10.5px/1 var(--mono);color:var(--dim)}
.cols li::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 3px);transform:translateX(-50%);padding:6px 8px;border-radius:6px;background:var(--ink);color:var(--bg);font:500 11px/1 var(--mono);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s;z-index:3}
.cols li:hover::after,.cols li:focus-visible::after{opacity:1}
.cols li:first-child::after{left:0;transform:none}.cols li:last-child::after{left:auto;right:0;transform:none}
.gm{display:grid;grid-template-columns:70px minmax(0,1fr);gap:11px;align-items:start}
.gm img{width:70px;height:70px;border-radius:10px;object-fit:cover}
.gm p{font-size:12.5px;line-height:1.38}
.gm .tg{font:400 11px/1.3 var(--mono);color:var(--dim);margin-bottom:4px}
.gm .btn{margin-top:7px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tiles a{display:block;border-radius:9px;transition:transform .15s}
.tiles a:hover,.tiles a:focus-visible{transform:scale(1.12)}
.tiles img{width:100%;height:auto;aspect-ratio:1;border-radius:9px;object-fit:cover}
.tiles span{display:none}
body[data-view="stack"] .tiles{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 8px}
body[data-view="stack"] .tiles span{display:block;margin-top:5px;font-size:11px;line-height:1.2;text-align:center;color:var(--mut)}
.lk{display:grid;grid-template-columns:minmax(0,1fr)}
.lk li{display:flex;align-items:center;gap:8px;min-width:0;border-top:1px solid var(--line)}
.lk li:first-child{border-top:0}
.lk a{flex:1;min-width:0;display:flex;align-items:center;gap:9px;height:36px}
.lk a>svg:first-child{font-size:15px;color:var(--mut)}
.lk b{font-weight:700;white-space:nowrap}
.lk span{margin-left:auto;font:400 11px/1 var(--mono);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lk a>svg{flex:none}
.lk a>svg:last-child{font-size:11px;color:var(--dim)}
.lk a:hover b{color:var(--c)}
.lk button{flex:none;height:24px;padding:0 8px;border-radius:6px;border:1px solid var(--line2);background:none;font:500 10.5px/1 var(--mono);color:var(--mut)}
.lk button:hover{color:var(--ink);border-color:var(--c)}
.foot{margin:0;font:400 11.5px/1.5 var(--mono);color:var(--dim);text-align:center}
.foot b{color:var(--ink);font-weight:500}
body[data-view="graph"] .foot{position:fixed;z-index:18;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:calc(100% - 520px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
body[data-view="stack"] .foot{padding:26px 16px 0}
body[data-view="stack"] .card .cv{aspect-ratio:16/8}

/* ---------- floating controls ---------- */
.hud{position:fixed;z-index:20;display:flex;align-items:center;gap:4px;height:42px;padding:0 6px;border-radius:12px;background:rgba(22,26,33,.88);border:1px solid var(--line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 16px 34px -20px #000}
.hud.tl{left:max(14px,env(safe-area-inset-left,0px));top:calc(14px + env(safe-area-inset-top,0px));padding:0 14px 0 8px;gap:9px;font-weight:700}
.hud.tl img{width:24px;height:24px;border-radius:6px}
.hud.tl i{font-style:normal;color:var(--dim);font-weight:400}
.hud.tl span{font:400 12px/1 var(--mono);color:var(--mut)}
.hud.tr{right:max(14px,env(safe-area-inset-right,0px));top:calc(14px + env(safe-area-inset-top,0px))}
.hud button{height:30px;min-width:30px;padding:0 9px;border-radius:8px;border:0;background:none;color:var(--mut);display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:700;font-size:12.5px}
.hud button:hover{background:var(--node2);color:var(--ink)}
.hud button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.hud button svg{font-size:15px}
.hud hr{width:1px;height:18px;border:0;background:var(--line);margin:0 3px}
.hud output{min-width:44px;text-align:center;font:500 12px/1 var(--mono);color:var(--ink)}
.mm{position:fixed;z-index:20;left:max(14px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:156px;padding:6px;border-radius:12px;background:rgba(22,26,33,.88);border:1px solid var(--line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);cursor:crosshair;touch-action:none}
.mm svg{display:block;width:100%;height:auto;border-radius:7px;background:var(--field)}
.mm rect{fill:var(--c);opacity:.75}
.mm .vp{fill:rgba(255,255,255,.06);stroke:#fff;stroke-width:2;vector-effect:non-scaling-stroke;opacity:1}
.tip{position:fixed;z-index:19;left:50%;top:calc(17px + env(safe-area-inset-top,0px));transform:translateX(-50%);margin:0;padding:9px 14px;border-radius:999px;background:rgba(22,26,33,.88);border:1px solid var(--line);font-size:12.5px;color:var(--mut);white-space:nowrap;transition:opacity .5s;pointer-events:none}
.tip kbd{font:500 11px/1 var(--mono);padding:3px 5px;border-radius:5px;background:var(--field);border:1px solid var(--line);color:var(--ink)}
.tip.off{opacity:0}
body[data-view="stack"] .only-graph{display:none}
body[data-view="stack"] .hud{position:absolute}
@media (max-width:899px){.view{display:none}.hud.tr{display:none}}
@media (max-width:1280px){.tip{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-view="stack">

<div class="hud tl"><img src="../shared/img/n.png" alt="" width="24" height="24">imanneo.dev<i>/</i><span>site.graph</span></div>
<div class="hud tr" role="toolbar" aria-label="Canvas controls">
  <span class="view" role="group" aria-label="View" style="display:inline-flex;gap:2px"><button type="button" id="v-graph" aria-pressed="false">Graph</button><button type="button" id="v-stack" aria-pressed="true">Page</button></span>
  <hr class="only-graph">
  <button type="button" class="only-graph" id="z-out" aria-label="Zoom out"><span data-i="minus"></span></button>
  <output class="only-graph" id="z-val" aria-live="off">100%</output>
  <button type="button" class="only-graph" id="z-in" aria-label="Zoom in"><span data-i="plus"></span></button>
  <hr class="only-graph">
  <button type="button" class="only-graph" id="z-fit"><span data-i="fit"></span>Fit</button>
  <button type="button" class="only-graph" id="z-tidy"><span data-i="grid"></span>Tidy</button>
</div>

<main class="canvas" id="canvas">
  <div class="world" id="world"><svg class="wires" id="wires" aria-hidden="true"></svg></div>
</main>

<div class="mm only-graph" id="mm" aria-hidden="true"><svg id="mm-s"></svg></div>
<p class="foot" id="foot">© 2026 Iman Khoshabi · numbers from GitHub and pub.dev, 17 Nov 2026</p>
<p class="tip only-graph" id="tip">Drag the canvas to move around. Drag a node by its title. <kbd id="tip-k">Ctrl</kbd> + scroll zooms.</p>

<noscript><p style="padding:90px 20px;text-align:center">This page needs JavaScript. The games are at <a href="https://games.imanneo.dev/" style="text-decoration:underline">games.imanneo.dev</a> and fl_chart is at <a href="https://github.com/imaNNeo/fl_chart" style="text-decoration:underline">github.com/imaNNeo/fl_chart</a>.</p></noscript>

<script src="../shared/data.js"></script>
<script src="../shared/icons.js"></script>
<script src="../shared/options.js"></script>
<script>
(function () {
  var S = window.SITE, I = window.ICONS, fl = S.fl, $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;"); };
  var mm = function (q) { return window.matchMedia ? matchMedia(q) : { matches: false }; };
  var still = mm("(prefers-reduced-motion: reduce)").matches, wide = mm("(min-width:900px)");
  var clamp = function (v, a, b) { return v < a ? a : v > b ? b : v; };
  [].forEach.call(document.querySelectorAll("[data-i]"), function (el) { el.outerHTML = I[el.getAttribute("data-i")]; });
  if (/Mac|iPhone|iPad/.test(navigator.platform || "")) $("tip-k").textContent = "⌘";
  var canvas = $("canvas"), world = $("world"), wires = $("wires");

  /* ---------- nodes ---------- */
  var N = {}, order = 0;
  function pt(t, cls) { return '<i class="pt' + (cls ? " " + cls : "") + '" style="--pc:var(--t-' + t + ')"></i>'; }
  function node(id, o) {
    var el = document.createElement("article"), H = o.h1 ? "h1" : "h2";
    el.className = "node" + (o.cls ? " " + o.cls : ""); el.id = "n-" + id;
    el.style.setProperty("--w", o.w + "px"); el.style.setProperty("--c", "var(--t-" + o.c + ")"); el.style.setProperty("--o", order++);
    var ports = (o.ins || o.outs) ? '<div class="ports"><ul class="in">' + (o.ins || []).map(function (p) { return '<li data-port="' + p[0] + '">' + pt(p[2]) + esc(p[1]) + "</li>"; }).join("") + '</ul><ul class="out">' + (o.outs || []).map(function (p) { return '<li data-port="' + p[0] + '">' + esc(p[1]) + pt(p[2]) + "</li>"; }).join("") + "</ul></div>" : "";
    el.innerHTML = '<header class="nh"' + (o.head ? ' data-port="in"' : "") + ">" + (o.head ? pt(o.head[0], o.head[1]) : "") + '<i class="sq"></i><' + H + ">" + esc(o.title) + "</" + H + '><span class="ty">' + o.type + "</span></header>" + ports +
      '<div class="nb">' + o.body + "</div>" + (o.downs ? '<div class="downs">' + o.downs.map(function (d) { return '<div class="down" data-port="' + d[0] + '">' + esc(d[1]) + pt(d[2]) + "</div>"; }).join("") + "</div>" : "");
    world.appendChild(el);
    var n = N[id] = { id: id, el: el, x: 0, y: 0, hx: 0, hy: 0, ports: {}, head: o.head, c: o.c };
    [].forEach.call(el.querySelectorAll("[data-port]"), function (p) { n.ports[p.getAttribute("data-port")] = p; });
    return n;
  }
  var dl = (fl.downloads30 / 1e6).toFixed(2) + "M", feat = S.games.filter(function (g) { return g.featured; }), rest = S.games.filter(function (g) { return !g.featured; });
  var params = function (rows) { return '<dl class="params">' + rows.map(function (r) { return "<div><dt>" + r[0] + "</dt><dd>" + esc(r[1]) + "</dd></div>"; }).join("") + "</dl>"; };

  var chips = function (arr) { return '<div class="chips">' + arr.map(function (t) { return "<span>" + esc(t) + "</span>"; }).join("") + "</div>"; };
  node("me", { title: S.me.name, h1: true, type: "source", c: "me", w: 304,
    outs: [["oss", "open source", "package"], ["games", "games", "game"]], downs: [["links", "links", "link"]],
    body: '<div class="who"><img src="../shared/img/me.jpg" alt="Iman Khoshabi" width="58" height="58"><div><b>' + esc(S.me.name) + "</b><span>also known as " + esc(S.me.aka) + "</span></div></div>" +
      params([["role", S.me.role], ["city", S.me.city], ["years", S.me.years + " of building apps"]]) + "<p>I build apps for a living. On the side I look after a chart library and make small games.</p>" });
  node("fl", { title: "fl_chart", type: "package", c: "package", w: 350,
    ins: [["in", "in", "package"]], outs: [["numbers", "numbers", "number"]],
